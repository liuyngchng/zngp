<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - ZNGP 服务质量平台</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
    <div class="login-card">
        <h1 class="login-title">ZNGP 服务质量平台</h1>
        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码" autocomplete="current-password">
            </div>
            <div id="loginError" class="error-message" style="display:none"></div>
            <button type="submit" class="btn btn-primary btn-full">登录</button>
        </form>
    </div>
    <script>
        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('loginError');
            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                if (resp.ok) {
                    // 服务端已通过 Set-Cookie 写入 token，直接跳转
                    window.location.href = '/';
                } else {
                    const data = await resp.json();
                    errEl.textContent = data.error || '登录失败';
                    errEl.style.display = 'block';
                }
            } catch (err) {
                errEl.textContent = '网络错误，请检查服务器连接';
                errEl.style.display = 'block';
            }
        }
    </script>
</body>
</html>
