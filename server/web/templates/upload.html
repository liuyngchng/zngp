{{define "content_upload"}}
<div class="page-header">
    <h1>上传音频</h1>
    <a href="/records" class="btn btn-outline">返回列表</a>
</div>

<div class="section" style="max-width:640px">
    <h2>上传录音文件</h2>
    <p class="text-muted" style="margin-bottom:20px">手动上传音频文件进行转写和质检，与 App 端上传字段对齐。</p>

    <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group">
            <label for="title">标题</label>
            <input type="text" id="title" class="form-input" placeholder="可选，自动生成">
        </div>

        <div class="form-row">
            <div class="form-group flex-1">
                <label for="customerName">客户姓名 *</label>
                <input type="text" id="customerName" class="form-input" required placeholder="必填">
            </div>
            <div class="form-group flex-1">
                <label for="inspectorName">安检员/拜访人 *</label>
                <input type="text" id="inspectorName" class="form-input" required placeholder="必填">
            </div>
        </div>

        <div class="form-group">
            <label for="customerAddress">客户地址</label>
            <input type="text" id="customerAddress" class="form-input" placeholder="如：北京市朝阳区XX路XX号">
        </div>

        <div class="form-row">
            <div class="form-group flex-1">
                <label for="inspectionDate">安检/拜访日期</label>
                <input type="date" id="inspectionDate" class="form-input">
            </div>
            <div class="form-group flex-1">
                <label for="sourceType">来源类型</label>
                <select id="sourceType" class="form-select">
                    <option value="IMPORT">手动导入 (IMPORT)</option>
                    <option value="RECORDING">录音 (RECORDING)</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="description">备注</label>
            <textarea id="description" class="form-input" rows="3" placeholder="可选，补充说明"></textarea>
        </div>

        <div class="form-group">
            <label for="audioFile">音频文件 *</label>
            <input type="file" id="audioFile" class="form-input" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg" required>
            <div style="font-size:12px;color:var(--text-muted);margin-top:4px">支持 WAV、MP3、M4A 等格式，最大 {{printf "%d" .max_size_mb}}MB</div>
        </div>

        <div id="uploadMsg" style="margin:12px 0"></div>

        <button type="submit" class="btn btn-primary btn-full" id="submitBtn">开始上传</button>
    </form>

    <div id="uploadResult" style="display:none; margin-top:20px; padding:16px; border-radius:8px;"></div>
</div>

<script>
async function handleUpload(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    const msgDiv = document.getElementById('uploadMsg');
    const resultDiv = document.getElementById('uploadResult');

    const audioFile = document.getElementById('audioFile').files[0];
    if (!audioFile) {
        msgDiv.innerHTML = '<span style="color:var(--red)">请选择音频文件</span>';
        return;
    }

    const maxSizeMB = {{.max_size_mb}};
    if (audioFile.size > maxSizeMB * 1024 * 1024) {
        msgDiv.innerHTML = '<span style="color:var(--red)">文件超过大小限制 (' + maxSizeMB + 'MB)</span>';
        return;
    }

    const metadata = {
        title: document.getElementById('title').value || audioFile.name.replace(/\.[^.]+$/, ''),
        description: document.getElementById('description').value,
        inspector_name: document.getElementById('inspectorName').value,
        customer_name: document.getElementById('customerName').value,
        customer_address: document.getElementById('customerAddress').value,
        inspection_date: document.getElementById('inspectionDate').value + 'T00:00:00Z',
        source_type: document.getElementById('sourceType').value,
    };

    submitBtn.disabled = true;
    submitBtn.textContent = '上传中...';
    msgDiv.innerHTML = '';

    try {
        const formData = new FormData();
        formData.append('metadata', JSON.stringify(metadata));
        formData.append('audio', audioFile);

        const resp = await fetch('/api/records', {
            method: 'POST',
            credentials: 'same-origin',
            body: formData,
        });

        const data = await resp.json();

        if (resp.ok) {
            resultDiv.style.display = 'block';
            resultDiv.style.background = '#dcfce7';
            resultDiv.style.border = '1px solid var(--green)';
            resultDiv.innerHTML = `
                <strong style="color:var(--green)">上传成功！</strong>
                <p style="margin-top:8px">${data.message || ''}</p>
                <p style="margin-top:4px">转写状态：<span class="badge badge-${data.transcript_status || 'PENDING'}">${data.transcript_status || 'PENDING'}</span></p>
                <a href="/records/${data.record?.id || ''}" class="btn btn-primary" style="margin-top:12px">查看详情</a>
            `;
            document.getElementById('uploadForm').reset();
        } else {
            msgDiv.innerHTML = '<span style="color:var(--red)">上传失败: ' + (data.error || '未知错误') + '</span>';
        }
    } catch (err) {
        msgDiv.innerHTML = '<span style="color:var(--red)">上传失败: ' + err.message + '</span>';
    } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '开始上传';
    }
}
</script>
{{end}}{{template "layout" .}}
