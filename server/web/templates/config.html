{{define "content_config"}}
<div class="page-header">
    <h1><i class="fas fa-cog"></i> 系统配置</h1>
</div>

<div class="section" style="max-width:640px">
    <h2><i class="fas fa-headphones"></i> ASR 语音转写配置</h2>
    <div class="form-group">
        <label><i class="fas fa-id-card"></i> Workspace ID</label>
        <input type="text" id="asrWorkspaceId" class="form-input" placeholder="阿里云百炼 Workspace ID">
    </div>
    <div class="form-group">
        <label><i class="fas fa-key"></i> API Key</label>
        <input type="password" id="asrApiKey" class="form-input" placeholder="DashScope API Key">
    </div>
    <div class="form-group">
        <label><i class="fas fa-microchip"></i> 模型</label>
        <input type="text" id="asrModel" class="form-input" placeholder="qwen3-asr-flash">
    </div>

    <h2><i class="fas fa-robot"></i> LLM 质检配置</h2>
    <div class="form-group">
        <label><i class="fas fa-link"></i> API 地址</label>
        <input type="text" id="llmEndpoint" class="form-input" placeholder="https://api.deepseek.com">
    </div>
    <div class="form-group">
        <label><i class="fas fa-key"></i> API Key</label>
        <input type="password" id="llmApiKey" class="form-input" placeholder="API Key">
    </div>
    <div class="form-group">
        <label><i class="fas fa-microchip"></i> 模型名称</label>
        <input type="text" id="llmModel" class="form-input" placeholder="deepseek-v4-flash">
    </div>

    <button class="btn btn-primary" onclick="saveConfig()"><i class="fas fa-check"></i> 保存配置</button>
    <div id="configMsg" style="margin-top:12px"></div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', async function() {
        try {
            const resp = await apiFetch('/api/config');
            if (resp.ok) {
                const cfg = await resp.json();
                document.getElementById('asrWorkspaceId').value = cfg.asr_workspace_id || '';
                document.getElementById('asrModel').value = cfg.asr_model || '';
                document.getElementById('llmEndpoint').value = cfg.llm_endpoint || '';
                document.getElementById('llmModel').value = cfg.llm_model || '';
            }
        } catch (err) {}
    });

    async function saveConfig() {
        const config = {
            asr_workspace_id: document.getElementById('asrWorkspaceId').value,
            asr_api_key: document.getElementById('asrApiKey').value,
            asr_model: document.getElementById('asrModel').value,
            llm_endpoint: document.getElementById('llmEndpoint').value,
            llm_api_key: document.getElementById('llmApiKey').value,
            llm_model: document.getElementById('llmModel').value,
        };
        const msg = document.getElementById('configMsg');
        try {
            const resp = await apiFetch('/api/config', {
                method: 'PUT',
                body: JSON.stringify(config)
            });
            if (resp.ok) {
                msg.innerHTML = '<span style="color:var(--green)"><i class="fas fa-check-circle"></i> 配置已保存，重启服务后生效</span>';
            } else {
                const data = await resp.json();
                msg.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 保存失败: ' + (data.error || '') + '</span>';
            }
        } catch (err) {
            msg.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 保存失败: ' + err.message + '</span>';
        }
    }
</script>
{{end}}
{{template "layout" .}}
