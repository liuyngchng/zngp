<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body><th:block th:fragment="content">
<div class="page-header">
    <h1><i class="fas fa-cloud-upload-alt"></i> 资料上传</h1>
</div>
<div class="section" style="max-width:640px">
    <p class="text-muted" style="margin-bottom:20px"><i class="fas fa-info-circle"></i> 上传音频自动转写并质检，或直接粘贴文本跳过转写步骤。</p>
    <div class="tab-bar" style="display:flex; gap:0; margin-bottom:20px; border-bottom:2px solid var(--border, #e5e7eb);">
        <button type="button" id="tabAudio" class="tab-btn tab-active" onclick="switchTab('audio')"><i class="fas fa-file-audio"></i> 音频上传</button>
        <button type="button" id="tabText" class="tab-btn" onclick="switchTab('text')"><i class="fas fa-file-alt"></i> 文本录入</button>
    </div>
    <div id="panelAudio">
    <form id="uploadForm" onsubmit="handleUpload(event)">
        <div class="form-group"><label><i class="fas fa-tag"></i> 标题</label><input type="text" id="title" class="form-input" placeholder="可选，自动用文件名填充"></div>
        <div class="form-row">
            <div class="form-group flex-1"><label><i class="fas fa-user"></i> 客户姓名 *</label><input type="text" id="customerName" class="form-input" required placeholder="必填"></div>
            <div class="form-group flex-1"><label><i class="fas fa-user-tie"></i> 安检员/拜访人 *</label><input type="text" id="inspectorName" class="form-input" required placeholder="必填"></div>
        </div>
        <div class="form-group"><label><i class="fas fa-map-marker-alt"></i> 客户地址</label><input type="text" id="customerAddress" class="form-input" placeholder="如：北京市朝阳区XX路XX号"></div>
        <div class="form-row">
            <div class="form-group flex-1"><label><i class="fas fa-calendar-alt"></i> 安检/拜访日期</label><input type="date" id="inspectionDate" class="form-input"></div>
            <div class="form-group flex-1"><label><i class="fas fa-tag"></i> 来源类型</label><select id="sourceType" class="form-select"><option value="IMPORT">手动导入</option><option value="RECORDING">录音</option></select></div>
        </div>
        <div class="form-group"><label><i class="fas fa-pencil-alt"></i> 备注</label><textarea id="description" class="form-input" rows="3" placeholder="可选，补充说明"></textarea></div>
        <div class="form-group"><label><i class="fas fa-file-audio"></i> 音频文件 *</label><input type="file" id="audioFile" class="form-input" accept="audio/*,.wav,.mp3,.m4a,.aac,.ogg" required>
            <div style="font-size:0.82rem;color:var(--text-muted);margin-top:4px">支持 WAV、MP3、M4A 等格式，最大 <span th:text="${max_size_mb}">100</span>MB</div>
        </div>
        <div id="uploadMsg" style="margin:12px 0"></div>
        <button type="submit" class="btn btn-primary btn-full" id="submitBtn"><i class="fas fa-cloud-upload-alt"></i> 开始上传</button>
    </form>
    </div>
    <div id="panelText" style="display:none">
    <form id="textForm" onsubmit="handleTextUpload(event)">
        <div class="form-group"><label><i class="fas fa-tag"></i> 标题</label><input type="text" id="textTitle" class="form-input" placeholder="可选"></div>
        <div class="form-row">
            <div class="form-group flex-1"><label><i class="fas fa-user"></i> 客户姓名 *</label><input type="text" id="textCustomerName" class="form-input" required placeholder="必填"></div>
            <div class="form-group flex-1"><label><i class="fas fa-user-tie"></i> 安检员/拜访人 *</label><input type="text" id="textInspectorName" class="form-input" required placeholder="必填"></div>
        </div>
        <div class="form-group"><label><i class="fas fa-map-marker-alt"></i> 客户地址</label><input type="text" id="textCustomerAddress" class="form-input" placeholder="如：北京市朝阳区XX路XX号"></div>
        <div class="form-group"><label><i class="fas fa-calendar-alt"></i> 安检/拜访日期</label><input type="date" id="textInspectionDate" class="form-input"></div>
        <div class="form-group"><label><i class="fas fa-file-alt"></i> 转写文本 *</label><textarea id="transcriptText" class="form-input" rows="10" required placeholder="粘贴转写文本，跳过 ASR 直接进入质检"></textarea></div>
        <div id="textMsg" style="margin:12px 0"></div>
        <button type="submit" class="btn btn-primary btn-full" id="textSubmitBtn"><i class="fas fa-paper-plane"></i> 提交</button>
    </form>
    </div>
    <div id="uploadResult" style="display:none; margin-top:20px; padding:16px; border-radius:8px;"></div>
</div>
<style>
    .tab-btn { flex:1; padding:10px 16px; border:none; background:transparent; font-size:0.95rem; font-weight:600; color:var(--text-muted, #6b7280); cursor:pointer; border-bottom:3px solid transparent; transition:all 0.2s; }
    .tab-btn:hover { color:var(--primary, #2563eb); }
    .tab-active { color:var(--primary, #2563eb); border-bottom-color:var(--primary, #2563eb); }
</style>
<script>
function switchTab(tab) {
    document.getElementById('panelAudio').style.display = tab === 'audio' ? 'block' : 'none';
    document.getElementById('panelText').style.display = tab === 'text' ? 'block' : 'none';
    document.getElementById('tabAudio').classList.toggle('tab-active', tab === 'audio');
    document.getElementById('tabText').classList.toggle('tab-active', tab === 'text');
    document.getElementById('uploadResult').style.display = 'none';
}
function showResult(data) {
    var div = document.getElementById('uploadResult');
    div.style.display = 'block';
    div.style.background = '#dcfce7';
    div.style.border = '1px solid var(--green)';
    div.innerHTML = '<strong style="color:var(--green)"><i class="fas fa-check-circle"></i> 上传成功！</strong><p style="margin-top:8px">' + (data.message || '') + '</p><p style="margin-top:4px">转写状态：<span class="badge badge-' + (data.transcript_status || 'PENDING') + '">' + (data.transcript_status || 'PENDING') + '</span></p><a href="/records/' + (data.record && data.record.id || '') + '" class="btn btn-primary" style="margin-top:12px"><i class="fas fa-arrow-right"></i> 查看详情</a>';
}
async function handleUpload(e) {
    e.preventDefault();
    var submitBtn = document.getElementById('submitBtn'), msgDiv = document.getElementById('uploadMsg');
    var audioFile = document.getElementById('audioFile').files[0];
    if (!audioFile) { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 请选择音频文件</span>'; return; }
    var maxSizeMB = /*[[${max_size_mb}]]*/ 100;
    if (audioFile.size > maxSizeMB * 1024 * 1024) { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 文件超过大小限制 (' + maxSizeMB + 'MB)</span>'; return; }
    var metadata = {title: document.getElementById('title').value || audioFile.name.replace(/\.[^.]+$/, ''), description: document.getElementById('description').value, inspector_name: document.getElementById('inspectorName').value, customer_name: document.getElementById('customerName').value, customer_address: document.getElementById('customerAddress').value, inspection_date: document.getElementById('inspectionDate').value + 'T00:00:00Z', source_type: document.getElementById('sourceType').value};
    submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 上传中...'; msgDiv.innerHTML = '';
    try {
        var formData = new FormData(); formData.append('metadata', JSON.stringify(metadata)); formData.append('audio', audioFile);
        var resp = await fetch('/api/records', {method: 'POST', credentials: 'same-origin', body: formData});
        var data = await resp.json();
        if (resp.ok) { showResult(data); document.getElementById('uploadForm').reset(); }
        else { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 上传失败: ' + (data.error || '未知错误') + '</span>'; }
    } catch (err) { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 上传失败: ' + err.message + '</span>'; }
    finally { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-cloud-upload-alt"></i> 开始上传'; }
}
async function handleTextUpload(e) {
    e.preventDefault();
    var submitBtn = document.getElementById('textSubmitBtn'), msgDiv = document.getElementById('textMsg');
    var transcriptText = document.getElementById('transcriptText').value.trim();
    if (!transcriptText) { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 请输入转写文本</span>'; return; }
    var payload = {title: document.getElementById('textTitle').value, inspector_name: document.getElementById('textInspectorName').value, customer_name: document.getElementById('textCustomerName').value, customer_address: document.getElementById('textCustomerAddress').value, inspection_date: document.getElementById('textInspectionDate').value + 'T00:00:00Z', source_type: 'TEXT', transcript_text: transcriptText};
    submitBtn.disabled = true; submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> 提交中...'; msgDiv.innerHTML = '';
    try {
        var resp = await fetch('/api/records/text', {method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
        var data = await resp.json();
        if (resp.ok) { showResult(data); document.getElementById('textForm').reset(); }
        else { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 提交失败: ' + (data.error || '未知错误') + '</span>'; }
    } catch (err) { msgDiv.innerHTML = '<span style="color:var(--red)"><i class="fas fa-exclamation-circle"></i> 提交失败: ' + err.message + '</span>'; }
    finally { submitBtn.disabled = false; submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交'; }
}
</script>
</th:block></body></html>
