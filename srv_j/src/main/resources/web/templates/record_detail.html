<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body><th:block th:fragment="content">
<div class="page-header">
    <h1><i class="fas fa-file-audio"></i> 记录详情</h1>
    <a href="/records" class="btn btn-outline"><i class="fas fa-arrow-left"></i> 返回列表</a>
</div>
<div class="detail-grid">
    <div class="detail-section">
        <h2><i class="fas fa-info-circle"></i> 基本信息</h2>
        <dl class="detail-list">
            <dt>客户姓名</dt><dd th:text="${record.customerName}">-</dd>
            <dt>安检员</dt><dd th:text="${record.inspectorName}">-</dd>
            <dt>客户地址</dt><dd th:text="${record.customerAddress}">-</dd>
            <dt>安检日期</dt><dd th:text="${#temporals.format(record.inspectionDate, 'yyyy-MM-dd HH:mm')}">-</dd>
            <dt>音频时长</dt><dd th:text="${#numbers.formatInteger(record.audioDuration)} + ' 秒'">0s</dd>
        </dl>
        <h3><i class="fas fa-play-circle"></i> 音频播放</h3>
        <audio controls class="audio-player" id="audioPlayer" preload="none"></audio>
        <h3><i class="fas fa-file-alt"></i> 转写文本</h3>
        <div th:if="${record.transcriptText != null and !record.transcriptText.isEmpty()}" class="transcript-text" th:text="${record.transcriptText}">转写文本</div>
        <div th:if="${record.transcriptStatus == 'FAILED'}" class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i>
            <p>转写失败</p>
            <button class="btn btn-primary" th:attr="onclick='transcribeRecord(\'' + ${record.id} + '\')'"><i class="fas fa-redo"></i> 重试转写</button>
        </div>
        <div th:if="${record.transcriptStatus == 'PROCESSING'}" class="empty-state">
            <i class="fas fa-spinner fa-pulse"></i><p>正在转写...</p>
        </div>
        <div th:if="${record.transcriptStatus == 'PENDING' or record.transcriptStatus == 'NONE'}" class="empty-state">
            <i class="fas fa-spinner fa-pulse"></i>
            <p>尚未转写</p>
            <button class="btn btn-primary" th:attr="onclick='transcribeRecord(\'' + ${record.id} + '\')'"><i class="fas fa-play"></i> 开始转写</button>
        </div>
    </div>
    <div class="detail-section">
        <h2><i class="fas fa-robot"></i> AI 质检</h2>
        <th:block th:if="${inspection != null}">
        <div class="inspection-summary">
            <div class="conclusion" th:classappend="'conclusion-' + ${inspection.overallConclusion}">
                <i class="fas fa-gavel"></i> 结论：<span th:text="${inspection.overallConclusion}">-</span>
            </div>
            <div class="score"><i class="fas fa-chart-bar"></i> 综合评分：<span th:text="${inspection.overallScore}">0</span> 分</div>
            <div class="inspection-summary-text" th:text="${inspection.summary}">总结</div>
        </div>
        <h3><i class="fas fa-list-ul"></i> 逐项检查结果</h3>
        <table class="table">
            <thead><tr><th>检查项</th><th>判定</th><th>置信度</th><th>证据</th></tr></thead>
            <tbody>
                <tr th:each="ir : ${inspection.items}">
                    <td th:text="${ir.itemName}">-</td>
                    <td><span class="badge" th:classappend="'badge-' + ${ir.verdict}" th:text="${ir.verdict}">-</span></td>
                    <td th:text="${#numbers.formatDecimal(ir.confidence * 100, 0, 0)} + '%'">0%</td>
                    <td class="evidence-text" th:text="${ir.evidence}">-</td>
                </tr>
            </tbody>
        </table>
        </th:block>
        <div th:if="${inspection == null and record.inspectionStatus == 'FAILED'}" class="empty-state">
            <i class="fas fa-exclamation-triangle" style="color:#f59e0b;"></i><p>质检失败</p>
            <form th:if="${record.transcriptText != null and !record.transcriptText.isEmpty()}" th:attr="onsubmit='inspectRecord(event, \'' + ${record.id} + '\')'">
                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> 选择检查项模板</label>
                    <select id="templateSelect" class="form-select">
                        <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}">模板</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-redo"></i> 重新质检</button>
            </form>
            <p th:unless="${record.transcriptText != null and !record.transcriptText.isEmpty()}" class="text-muted">请先完成转写</p>
        </div>
        <div th:if="${inspection == null and record.inspectionStatus == 'PROCESSING'}" class="empty-state">
            <i class="fas fa-spinner fa-pulse"></i><p>正在质检...</p>
        </div>
        <div th:if="${inspection == null and record.inspectionStatus != 'FAILED' and record.inspectionStatus != 'PROCESSING'}" class="empty-state">
            <i class="fas fa-robot"></i><p>尚未质检</p>
            <form th:if="${record.transcriptText != null and !record.transcriptText.isEmpty()}" th:attr="onsubmit='inspectRecord(event, \'' + ${record.id} + '\')'">
                <div class="form-group">
                    <label><i class="fas fa-clipboard-check"></i> 选择检查项模板</label>
                    <select id="templateSelect" class="form-select">
                        <option th:each="t : ${templates}" th:value="${t.id}" th:text="${t.name}">模板</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-robot"></i> 开始质检</button>
            </form>
            <p th:unless="${record.transcriptText != null and !record.transcriptText.isEmpty()}" class="text-muted">请先完成转写</p>
        </div>
    </div>
</div>
<script>
    async function transcribeRecord(id) {
        if (!confirm('确认开始转写？')) return;
        try {
            var resp = await apiFetch('/api/records/' + id + '/transcribe', {method: 'POST'});
            if (resp.ok) { alert('转写完成，正在刷新...'); window.location.reload(); }
            else { var data = await resp.json(); alert('转写失败: ' + (data.error || '未知错误')); }
        } catch (err) { alert('转写失败: ' + err.message); }
    }
    async function inspectRecord(e, id) {
        e.preventDefault();
        var templateId = document.getElementById('templateSelect').value;
        if (!templateId) { alert('请选择模板'); return; }
        if (!confirm('确认开始 AI 质检？')) return;
        try {
            var resp = await apiFetch('/api/records/' + id + '/inspect', {
                method: 'POST', body: JSON.stringify({template_id: parseInt(templateId)})
            });
            if (resp.ok) { alert('质检完成，正在刷新...'); window.location.reload(); }
            else { var data = await resp.json(); alert('质检失败: ' + (data.error || '未知错误')); }
        } catch (err) { alert('质检失败: ' + err.message); }
    }
    document.addEventListener('DOMContentLoaded', function() {
        var audio = document.getElementById('audioPlayer');
        if (audio) {
            fetch('/api/records/' + /*[[${record.id}]]*/ '' + '/audio', {credentials: 'same-origin'})
                .then(function(resp) { if (resp.ok) return resp.blob(); throw new Error('加载音频失败'); })
                .then(function(blob) { audio.src = URL.createObjectURL(blob); })
                .catch(function(err) { console.error(err); });
        }
    });
</script>
</th:block></body></html>
