<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body><th:block th:fragment="content">
<div class="page-header">
    <h1><i class="fas fa-list-alt"></i> records</h1>
    <form method="GET" action="/records" class="search-form">
        <input type="text" name="keyword" th:value="${keyword}" placeholder="search customer, inspector, title..." class="search-input">
        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> search</button>
    </form>
</div>
<div class="section">
    <table class="table">
        <thead><tr>
            <th>customer</th><th>inspector</th><th>address</th><th>date</th>
            <th>duration</th><th>transcript</th><th>inspection</th><th>action</th>
        </tr></thead>
        <tbody>
            <tr th:each="r : ${records}">
                <td th:text="${r.customerName}">-</td>
                <td th:text="${r.inspectorName}">-</td>
                <td th:text="${r.customerAddress}">-</td>
                <td th:text="${#temporals.format(r.inspectionDate, 'yyyy-MM-dd')}">-</td>
                <td th:text="${#numbers.formatInteger(r.audioDuration)} + 's'">0s</td>
                <td><span class="badge" th:classappend="'badge-' + ${r.transcriptStatus}" th:text="${r.transcriptStatus}">PENDING</span></td>
                <td><span class="badge" th:classappend="'badge-' + ${r.inspectionStatus}" th:text="${r.inspectionStatus}">NONE</span></td>
                <td>
                    <a th:href="@{/records/{id}(id=${r.id})}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-right"></i> detail</a>
                    <button th:if="${r.transcriptStatus == 'FAILED'}" class="btn btn-sm btn-warning" th:attr="onclick='retryTranscribe(\'' + ${r.id} + '\')'" title="retry transcribe"><i class="fas fa-redo"></i></button>
                    <button th:if="${r.inspectionStatus == 'FAILED'}" class="btn btn-sm btn-warning" th:attr="onclick='retryInspect(\'' + ${r.id} + '\')'" title="retry inspect"><i class="fas fa-redo"></i></button>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(records)}">
                <td colspan="8" class="text-center" style="padding:32px;"><i class="fas fa-inbox" style="font-size:2rem;color:#d0d5dd;display:block;margin-bottom:8px;"></i>no records</td>
            </tr>
        </tbody>
    </table>
    <div class="pagination" th:if="${total_pages > 1}">
        <a th:if="${page > 1}" th:href="@{/records(page=${page - 1}, keyword=${keyword})}" class="btn btn-outline"><i class="fas fa-chevron-left"></i> prev</a>
        <span th:text="'page ' + ${page} + ' / ' + ${total_pages} + ' (total ' + ${total} + ')'">page</span>
        <a th:if="${page < total_pages}" th:href="@{/records(page=${page + 1}, keyword=${keyword})}" class="btn btn-outline">next <i class="fas fa-chevron-right"></i></a>
    </div>
</div>
<script>
    async function retryTranscribe(id) {
        if (!confirm('retry transcription?')) return;
        try {
            var resp = await apiFetch('/api/records/' + id + '/transcribe', {method: 'POST'});
            if (resp.ok) { alert('transcription complete, reloading...'); window.location.reload(); }
            else { var data = await resp.json(); alert('transcription failed: ' + (data.error || 'unknown error')); }
        } catch (err) { alert('transcription failed: ' + err.message); }
    }
    function retryInspect(id) { window.location.href = '/records/' + id; }
</script>
</th:block></body></html>
