<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"></head>
<body><th:block th:fragment="content">
<div class="page-header">
    <h1><i class="fas fa-edit"></i> edit template: <span th:text="${template.name}">name</span></h1>
    <a href="/templates" class="btn btn-outline"><i class="fas fa-arrow-left"></i> back</a>
</div>
<div class="section">
    <h2><i class="fas fa-info-circle"></i> template info</h2>
    <div class="form-group">
        <label><i class="fas fa-tag"></i> name</label>
        <input type="text" id="templateName" th:value="${template.name}" class="form-input">
    </div>
    <div class="form-group">
        <label><i class="fas fa-pencil-alt"></i> description</label>
        <input type="text" id="templateDesc" th:value="${template.description}" class="form-input">
    </div>
    <button class="btn btn-primary" th:attr="onclick='saveTemplate(' + ${template.id} + ')'"><i class="fas fa-check"></i> save</button>
</div>
<div class="section">
    <h2><i class="fas fa-list-ul"></i> items</h2>
    <table class="table">
        <thead><tr><th style="width:50px">no.</th><th>name</th><th>desc</th><th>category</th><th>required</th><th>weight</th><th style="width:80px">action</th></tr></thead>
        <tbody id="itemsBody">
            <tr th:each="it : ${template.items}" th:attr="id='item-row-' + ${it.id}">
                <td th:text="${it.itemNumber}">1</td>
                <td th:text="${it.name}">name</td>
                <td th:text="${it.description}">desc</td>
                <td th:text="${it.category}">category</td>
                <td><i th:if="${it.isRequired}" class="fas fa-check" style="color:var(--green)"></i></td>
                <td th:text="${it.weight}">1</td>
                <td><button class="btn btn-sm btn-danger" th:attr="onclick='deleteItem(' + ${it.id} + ')'"><i class="fas fa-trash"></i></button></td>
            </tr>
        </tbody>
    </table>
    <h3><i class="fas fa-plus-circle"></i> add item</h3>
    <form class="add-item-form" th:attr="onsubmit='addItem(event, ' + ${template.id} + ')'">
        <div class="form-row">
            <div class="form-group"><label>no.</label><input type="number" id="itemNumber" value="1" min="1" class="form-input" style="width:80px"></div>
            <div class="form-group flex-1"><label>name</label><input type="text" id="itemName" required class="form-input"></div>
            <div class="form-group flex-1"><label>desc</label><input type="text" id="itemDesc" class="form-input"></div>
            <div class="form-group"><label>category</label><input type="text" id="itemCategory" class="form-input" style="width:120px"></div>
            <div class="form-group"><label>required</label><input type="checkbox" id="itemRequired" checked style="width:20px;height:20px;"></div>
            <div class="form-group"><label>weight</label><input type="number" id="itemWeight" value="1" min="1" max="5" class="form-input" style="width:70px"></div>
        </div>
        <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> add</button>
    </form>
</div>
<script>
    async function saveTemplate(id) {
        var name = document.getElementById('templateName').value;
        var desc = document.getElementById('templateDesc').value;
        try {
            var resp = await apiFetch('/api/templates/' + id, {method: 'PUT', body: JSON.stringify({name: name, description: desc})});
            if (resp.ok) alert('saved'); else alert('save failed');
        } catch (err) { alert('save failed: ' + err.message); }
    }
    async function addItem(e, templateId) {
        e.preventDefault();
        var item = {
            item_number: parseInt(document.getElementById('itemNumber').value),
            name: document.getElementById('itemName').value,
            description: document.getElementById('itemDesc').value,
            category: document.getElementById('itemCategory').value,
            is_required: document.getElementById('itemRequired').checked,
            weight: parseInt(document.getElementById('itemWeight').value)
        };
        try {
            var resp = await apiFetch('/api/templates/' + templateId + '/items', {method: 'POST', body: JSON.stringify(item)});
            if (resp.ok) { alert('added'); window.location.reload(); }
            else { var data = await resp.json(); alert('add failed: ' + (data.error || '')); }
        } catch (err) { alert('add failed: ' + err.message); }
    }
    async function deleteItem(itemId) {
        if (!confirm('delete this item?')) return;
        var templateId = /*[[${template.id}]]*/ 0;
        try {
            var resp = await apiFetch('/api/templates/' + templateId + '/items/' + itemId, {method: 'DELETE'});
            if (resp.ok) { document.getElementById('item-row-' + itemId).remove(); alert('deleted'); }
            else alert('delete failed');
        } catch (err) { alert('delete failed: ' + err.message); }
    }
</script>
</th:block></body></html>
