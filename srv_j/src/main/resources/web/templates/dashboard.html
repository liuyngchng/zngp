<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
<th:block th:fragment="content">
<div class="page-header">
    <h1><i class="fas fa-tachometer-alt"></i> dashboard</h1>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-number" th:text="${total_records}">0</div>
        <div class="stat-label"><i class="fas fa-file-audio"></i> total records</div>
    </div>
    <div class="stat-card stat-card-green">
        <div class="stat-number" th:text="${compliant_count}">0</div>
        <div class="stat-label"><i class="fas fa-check-circle"></i> compliant</div>
    </div>
    <div class="stat-card stat-card-red">
        <div class="stat-number" th:text="${non_compliant}">0</div>
        <div class="stat-label"><i class="fas fa-times-circle"></i> non-compliant</div>
    </div>
    <div class="stat-card stat-card-yellow">
        <div class="stat-number" th:text="${review_count}">0</div>
        <div class="stat-label"><i class="fas fa-exclamation-triangle"></i> review</div>
    </div>
</div>

<div class="section">
    <h2><i class="fas fa-clock"></i> recent records</h2>
    <table class="table">
        <thead>
            <tr>
                <th>customer</th><th>inspector</th><th>date</th>
                <th>transcript</th><th>inspection</th><th>action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="r : ${recent_records}">
                <td th:text="${r.customerName}">customer</td>
                <td th:text="${r.inspectorName}">inspector</td>
                <td th:text="${#temporals.format(r.inspectionDate, 'yyyy-MM-dd')}">date</td>
                <td><span class="badge" th:classappend="'badge-' + ${r.transcriptStatus}" th:text="${r.transcriptStatus}">status</span></td>
                <td>
                    <th:block th:if="${r.inspectionStatus == 'COMPLETED'}">
                        <a th:href="@{/records/{id}(id=${r.id})}"><i class="fas fa-eye"></i> view</a>
                    </th:block>
                    <th:block th:if="${r.inspectionStatus != 'COMPLETED' and r.inspectionStatus != 'NONE'}">
                        <span class="badge badge-blue" th:text="${r.inspectionStatus}">status</span>
                    </th:block>
                    <th:block th:if="${r.inspectionStatus == 'NONE'}">
                        <span class="badge badge-gray">not inspected</span>
                    </th:block>
                </td>
                <td>
                    <a th:href="@{/records/{id}(id=${r.id})}" class="btn btn-sm btn-outline"><i class="fas fa-arrow-right"></i> detail</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(recent_records)}">
                <td colspan="6" class="text-center" style="padding:32px;">
                    <i class="fas fa-inbox" style="font-size:2rem;color:#d0d5dd;display:block;margin-bottom:8px;"></i>
                    no records
                </td>
            </tr>
        </tbody>
    </table>
</div>
</th:block>
</body>
</html>
