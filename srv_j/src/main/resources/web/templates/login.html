<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/lib/font-awesome.all.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v=2">
    <title th:text="'login - ' + ${sysName}">login</title>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-microphone-alt"></i>
                <h1 th:text="${sysName}">system</h1>
                <p>gas inspection &amp; customer visit quality audit</p>
            </div>

            <div class="login-error" id="loginError" style="display:none;">
                <i class="fas fa-exclamation-circle"></i> <span id="loginErrorMsg"></span>
            </div>

            <form id="loginForm" class="login-form">
                <div class="login-field">
                    <label><i class="fas fa-user"></i> username</label>
                    <input type="text" id="username" name="username" required placeholder="username" autocomplete="username">
                </div>
                <div class="login-field">
                    <label><i class="fas fa-lock"></i> password</label>
                    <input type="password" id="password" name="password" required placeholder="password" autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> login
                </button>
            </form>

            <form id="changePwdForm" class="login-form" style="display:none;">
                <div class="login-header" style="margin-bottom:12px;">
                    <h2 style="font-size:1.2rem;color:#fff;">first login, change password</h2>
                </div>
                <div class="login-error" id="changePwdError" style="display:none;">
                    <i class="fas fa-exclamation-circle"></i> <span id="changePwdErrorMsg"></span>
                </div>
                <input type="hidden" id="old_password" name="old_password">
                <div class="login-field">
                    <label><i class="fas fa-key"></i> new password</label>
                    <input type="password" id="new_password" name="new_password" required placeholder="new password (min 6 chars)" autocomplete="new-password">
                </div>
                <div class="login-field">
                    <label><i class="fas fa-check-circle"></i> confirm password</label>
                    <input type="password" id="confirm_password" name="confirm_password" required placeholder="re-enter new password" autocomplete="new-password">
                </div>
                <button type="submit" class="login-btn">
                    <i class="fas fa-save"></i> change password
                </button>
            </form>

            <div class="login-footer">
                <p th:text="${sysName} + ' · voice quality audit system'">system</p>
            </div>
        </div>
    </div>

    <script>
        async function doLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errEl = document.getElementById('loginError');
            const errMsg = document.getElementById('loginErrorMsg');
            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await resp.json();
                if (resp.ok) {
                    if (data.must_change_password) {
                        document.getElementById('loginForm').style.display = 'none';
                        document.getElementById('changePwdForm').style.display = 'block';
                        document.getElementById('old_password').value = password;
                    } else {
                        window.location.href = '/';
                    }
                } else {
                    errMsg.textContent = data.error || 'login failed';
                    errEl.style.display = 'flex';
                }
            } catch (err) {
                errMsg.textContent = 'network error, check server connection';
                errEl.style.display = 'flex';
            }
        }

        async function doChangePassword(e) {
            e.preventDefault();
            const oldPassword = document.getElementById('old_password').value;
            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const errEl = document.getElementById('changePwdError');
            const errMsg = document.getElementById('changePwdErrorMsg');

            if (newPassword.length < 6) {
                errMsg.textContent = 'new password must be at least 6 characters';
                errEl.style.display = 'flex';
                return;
            }
            if (newPassword !== confirmPassword) {
                errMsg.textContent = 'passwords do not match';
                errEl.style.display = 'flex';
                return;
            }

            try {
                const resp = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({old_password: oldPassword, new_password: newPassword})
                });
                const data = await resp.json();
                if (resp.ok) {
                    window.location.href = '/';
                } else {
                    errMsg.textContent = data.error || 'password change failed';
                    errEl.style.display = 'flex';
                }
            } catch (err) {
                errMsg.textContent = 'network error, check server connection';
                errEl.style.display = 'flex';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', doLogin);
        document.getElementById('changePwdForm').addEventListener('submit', doChangePassword);
    </script>
</body>
</html>
